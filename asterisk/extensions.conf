;
; statuspage-pinger dialplan.
;
; Replaces the demo dialplan the package ships (it contained [demo], [public]
; and [default] with reachable extensions). Only two contexts exist here: a
; dead end for anything inbound, and the outbound alert call.
;
[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]

; Endpoint "linphone" points its inbound calls here on purpose: nothing in this
; context, so an unexpected INVITE from the provider lands nowhere.
[nirgendwo]

[statuspage-alert]
exten => alert,1,NoOp(alert ${ALERT_ID})
 same => n,Answer()
 ; The acknowledge key is configured in .env and arrives as an Originate
 ; variable; fall back to 1 so a missing variable cannot swallow every ack.
 same => n,ExecIf($["${ACK_DIGIT}"=""]?Set(ACK_DIGIT=1))
 ; ANNOUNCE comes in as an Originate variable: absolute path, no extension.
 ; attempts=1 — the WAV already contains its own repeats (CALL_REPEATS=3), and
 ; Read() is interruptible during playback, so pressing 1 mid-sentence works.
 same => n,Read(ACK,${ANNOUNCE},1,,1,15)
 ; Read() returns ERROR immediately when the file cannot be opened. Without this
 ; branch that is indistinguishable from "answered but nobody pressed a key".
 same => n,GotoIf($["${READSTATUS}"="ERROR"]?fehler)
 same => n,GotoIf($["${ACK}"="${ACK_DIGIT}"]?quittiert)
 same => n,UserEvent(StatuspageAck,AlertId: ${ALERT_ID},Result: noack)
 same => n,Hangup()
 same => n(quittiert),UserEvent(StatuspageAck,AlertId: ${ALERT_ID},Result: ack)
 same => n,Hangup()
 same => n(fehler),UserEvent(StatuspageAck,AlertId: ${ALERT_ID},Result: playback-error)
 same => n,Hangup()
