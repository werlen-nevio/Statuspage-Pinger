;
; AMI is the only control channel the pinger uses. Loopback only — the firewall
; is not the thing keeping this closed, the bind address is.
;
[general]
enabled=yes
bindaddr=127.0.0.1
port=5038

[statuspage]
secret=__AMI_SECRET__
deny=0.0.0.0/0.0.0.0
permit=127.0.0.1/255.255.255.255
; "system" is mandatory: without it the Registry event never arrives and
; PJSIPShowRegistrationsOutbound answers "Permission denied".
read=system,call,dtmf,user,reporting
write=system,originate,call,user
