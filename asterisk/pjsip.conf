;
; statuspage-pinger: registers at sip.linphone.org (Flexisip) over TLS and places
; the alert call. This file replaces the shipped one, which was comment only.
;
[global]
type=global
keep_alive_interval=30
default_from_user=__SIP_USER__

[transport-tls]
type=transport
protocol=tls
; IPv4 literal on purpose: sip.linphone.org has an AAAA record and this host
; prefers IPv6. baresip died here with "Address family not supported".
bind=0.0.0.0
; Leaving method empty would mean TLS 1.0 only. The server speaks 1.2 and 1.3.
method=tlsv1_2
ca_list_file=/etc/ssl/certs/ca-certificates.crt
verify_server=yes
verify_client=no
require_client_cert=no
; No cert_file/priv_key_file — Asterisk is the TLS client here.

[linphone-auth]
type=auth
auth_type=userpass
username=__SIP_USER__
password=__SIP_PASSWORD__
; realm deliberately unset -> the realm the server sends is used.

[linphone-reg]
type=registration
transport=transport-tls
; No port: with :5061 pinned Asterisk only asks for A records and never learns
; about the second relay. Without it, NAPTR/SRV give sip11 and sip12.
server_uri=sip:sip.linphone.org\;transport=tls
client_uri=sip:__SIP_USER__@sip.linphone.org
outbound_auth=linphone-auth
contact_user=__SIP_USER__
expiration=600
; Not 30 — that would hammer Flexisip's DoS protection in a loop.
retry_interval=180
forbidden_retry_interval=300
fatal_retry_interval=300
; NOT 0: max_retries=0 means "no retry at all", not "infinite".
max_retries=10000
auth_rejection_permanent=no
support_path=yes
line=yes
endpoint=linphone

[linphone-aor]
type=aor
contact=sip:sip.linphone.org\;transport=tls
max_contacts=1
qualify_frequency=0

[linphone]
type=endpoint
transport=transport-tls
aors=linphone-aor
outbound_auth=linphone-auth
from_user=__SIP_USER__
from_domain=sip.linphone.org
; Inbound calls only — deliberately an empty context.
context=nirgendwo
disallow=all
allow=ulaw,alaw
dtmf_mode=rfc4733
media_encryption=sdes
; Decisive: with optimistic=yes Asterisk puts the crypto line into a plain
; RTP/AVP offer, which is exactly what Linphone answered with 488.
media_encryption_optimistic=no
srtp_tag_32=no
rtp_symmetric=yes
direct_media=no
; rtp_timeout intentionally unset (default 0): the announcement is ~42 s long
; and any smaller value cuts the call off mid-sentence.
